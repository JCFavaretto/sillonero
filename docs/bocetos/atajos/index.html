<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bocetos · Atajos y arranque (todos)</title>
<link rel="stylesheet" href="../_base.css">
<style>
  .toc{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin:8px 0 0}
  .toc a{color:var(--acc)}
  iframe{display:block;width:100%;max-width:1400px;margin:0 auto;border:0;border-top:2px solid #ccc;height:1500px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Atajos y arranque (B6) · todos los bocetos</h1>
  <p>Los 3 bocetos de la fase en una página. Cada uno sigue siendo su propio archivo. Plan en <code>docs/PLAN.md</code> 8.6. Pendientes del OK de Jay (09/11/2026).</p>
  <div class="toc" id="toc"></div>
  <p class="nav-links" style="margin-top:8px"><a href="../README.md">Índice general de bocetos</a></p>
</div>
<div id="all"></div>
<script>
// Para sumar un boceto nuevo de esta carpeta: agregarlo acá, en orden.
const BOCETOS = [
  ["01-escena-atajo-y-disparador-2026-11-09.html", "01 · Atajo y disparador de una escena"],
  ["02-panel-pc-2026-11-09.html", "02 · Panel de la PC"],
  ["03-bandeja-2026-11-09.html", "03 · Bandeja"],
];
const toc = document.getElementById("toc");
const all = document.getElementById("all");
for (const [file, name] of BOCETOS) {
  const id = file.slice(0, 2);
  toc.insertAdjacentHTML("beforeend", `<a href="#b${id}">${name}</a>`);
  all.insertAdjacentHTML("beforeend", `<iframe id="b${id}" src="${file}" title="${name}" loading="lazy"></iframe>`);
}
</script>
</body>
</html>

<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sillonero: sillón con pad y señal</title>
<style>
:root{--bg:#17161D;--s:#211F29;--b:#3B3746;--t:#F1EEE8;--m:#A29DAE;--a:#F5A524}

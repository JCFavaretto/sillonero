<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boceto · Rediseño · 06 Imagen y respaldo</title><link rel="stylesheet" href="../_base.css"><link rel="stylesheet" href="_neo.css"><script src="_kit.js"></script></head>
<body>
<script>
head("06 · Imagen de una tecla, respaldo y mudanza", "Fase F3 (D105 a D107). Tres cosas que rodean a los decks: ponerle <b>imagen</b> a una tecla (fija o animada), <b>exportar e importar</b> los decks a un archivo, y la <b>mudanza</b> que pasa una sola vez: las teclas y los links que hoy están en la PC se convierten en el primer deck del celu. El detalle del recorte depende de un spike de módulos nativos (S1 de F3): si la herramienta de recorte resulta distinta, este boceto se rehace antes de implementar.", ["05-editar-deck-2026-11-14.html", "05 · Editar un deck"], null);

const DONE = `<span class="btn p">Listo</span>`;
const dim = (h) => `<div style="opacity:.35">${h}</div>`;
const back = dim(dbar(["Principal", "Stream", "Trabajo"], "Stream") + dgrid(3, [dk("Modo stream", { bg: IMG.grape }), dk("OBS", { bg: IMG.night }), dk("Twitch", { bg: IMG.grape }), dk("Chat", { bg: IMG.sea }), dkEmpty, dkEmpty]));
const sheetL = (html) => `<div class="sidedim"></div><div class="side" style="overflow:auto;width:58%">${html.replace('<div class="grab"></div>', "")}</div>`;
const frame = (bg, o = {}) => `<div style="position:relative;height:${o.h || 150}px;border-radius:12px;background:${bg};overflow:hidden;margin-top:8px"><div style="position:absolute;inset:0;background:rgba(0,0,0,.55)"></div><div style="position:absolute;left:50%;top:50%;width:${o.w || 110}px;height:${o.w || 110}px;transform:translate(-50%,-50%);border:2px solid #F5A524;border-radius:12px;background:${bg};background-size:cover"></div></div>`;
const prev = (bg, tag) => `<div style="display:flex;gap:10px;align-items:flex-end;margin-top:10px"><div style="width:64px">${dk("Twitch", { bg, tag })}<div class="sub" style="text-align:center;margin-top:2px">Vertical</div></div><div style="width:110px"><div class="dk img" style="--ar:2.1/1;background:${bg}">${tag ? `<span class="tag">${tag}</span>` : ""}<b>Twitch</b></div><div class="sub" style="text-align:center;margin-top:2px">Apaisado</div></div></div>`;

const crop = `<div class="grab"></div><h3>Encuadrar la imagen</h3><div class="sub" style="white-space:normal">Mové y agrandá la foto con dos dedos. El recuadro ámbar es lo que se ve en la tecla.</div>${frame(IMG.grape)}${prev(IMG.grape)}<div class="acts"><span class="btn">Otra imagen</span><span class="btn p">Usar</span></div>`;
pair("A", "Imagen fija: elegir y encuadrar", "\"Elegir\" en la hoja de tecla abre la galería del celu. Después se encuadra: el recuadro es cuadrado (la forma de la tecla en vertical) y abajo se ve <b>cómo queda en las dos orientaciones</b>; en apaisado la tecla es más ancha y muestra la franja central. <b>Usar</b> guarda la imagen reducida (256 px) dentro de la app: no ocupa lugar de más ni depende de que la foto original siga en la galería. \"Otra imagen\" vuelve a la galería.",
  V({ title: "Escenas", right: DONE, tab: "Escenas", body: back, over: sheet(crop) }),
  L({ title: "Stream ▾", right: DONE, body: back, over: sheetL(crop.replace(frame(IMG.grape), frame(IMG.grape, { h: 90, w: 70 }))) }));

const anim = `<div class="grab"></div><h3>Imagen animada</h3><div class="sub" style="white-space:normal">Es un GIF: se guarda tal cual, sin recortar. En la tecla se ve el centro.</div>${prev(IMG.fire, "GIF")}<div class="lrow" style="margin-top:8px"><div class="grow"><b>Peso</b><div class="sub">1,2 MB de 2 MB</div></div><div class="grad" style="flex:none;width:90px"><b style="width:60%"></b></div></div><div class="sub" style="white-space:normal;margin-top:6px">Se mueve solo cuando estás viendo este deck.</div><div class="acts"><span class="btn">Otra imagen</span><span class="btn p">Usar</span></div>`;
const tooBig = `<h3>Imagen animada</h3><div class="err">Pesa 6,4 MB y el tope es 2 MB. Elegí una más liviana o usá una imagen fija.</div>${prev(IMG.fire, "GIF")}<div class="acts"><span class="btn p">Otra imagen</span><span class="btn">Usar el primer cuadro</span></div>`;
pair("B", "Imagen animada", "Un GIF o un WebP animado <b>no se recorta ni se recomprime</b>: se guarda como está, con tope de 2 MB, y la tecla lleva la marca \"GIF\". Se anima solo en el deck que se está viendo, se detiene con la app en segundo plano, y con \"reducir movimiento\" del celu (o el interruptor de Ajustes, C) muestra el primer cuadro. <b>Apaisado:</b> si pesa más que el tope, el aviso dice cuánto y ofrece dos salidas: otra imagen, o quedarse con el primer cuadro como imagen fija.",
  V({ title: "Escenas", right: DONE, tab: "Escenas", body: back, over: sheet(anim) }),
  L({ title: "Stream ▾", right: DONE, body: back, over: sheetL(tooBig) }));

const tg = (on) => `<span style="width:40px;height:24px;border-radius:12px;background:${on ? "#F5A524" : "#3B3746"};position:relative;flex:none"><i style="position:absolute;top:3px;${on ? "right" : "left"}:3px;width:18px;height:18px;border-radius:50%;background:#fff"></i></span>`;
const setRow = (t, s, r) => `<div class="lrow"><div class="grow"><b>${t}</b><div class="sub" style="white-space:normal">${s}</div></div>${r}</div>`;
const settings = (o = {}) => `<div class="sec" style="margin-top:0">Decks</div><div class="card">${setRow("Animar imágenes", o.reduce ? "Apagado por \"reducir movimiento\" del celu" : "Las teclas con GIF se mueven en el deck a la vista", tg(!o.reduce))}${setRow("Exportar decks", o.never ? "Nunca exportaste. Si perdés el celu, se pierden." : "Última vez: 21/11/2026 · 7 decks, 3,4 MB", `<span style="color:#A29DAE">›</span>`)}${setRow("Importar decks", "Desde un archivo de otro celu o un respaldo", `<span style="color:#A29DAE">›</span>`)}</div>`;
pair("C", "Ajustes: animación y respaldo", "Sección nueva en Ajustes. <b>Animar imágenes:</b> apaga todas las animaciones de las teclas (ahorra batería); si el celu tiene \"reducir movimiento\", queda apagado y lo dice. <b>Exportar decks:</b> arma un archivo con todos los decks y sus imágenes y abre el menú de compartir de Android (guardarlo, mandarlo a Drive, pasarlo a otro celu); la fila recuerda cuándo fue la última vez y avisa si nunca se hizo. <b>Importar decks:</b> abre el selector de archivos (D).",
  V({ title: "Ajustes", back: true, tab: "", body: settings() }),
  L({ title: "Ajustes", back: true, body: settings({ never: true, reduce: true }) }));

const imp = `<div class="grab"></div><h3>Importar decks</h3><div class="sub" style="white-space:normal">El archivo tiene <b>5 decks</b> y 31 teclas (2,1 MB). Este celu ya tiene 4.</div><div class="lrow" style="margin-top:6px"><div class="grow"><b>Sumar</b><div class="sub" style="white-space:normal">Quedan 9 decks: los tuyos y los del archivo</div></div><span class="btn p">Sumar</span></div><div class="lrow"><div class="grow"><b>Reemplazar</b><div class="sub" style="white-space:normal">Se borran los 4 de este celu</div></div><span class="btn" style="color:#FF8A8A;border-color:#5a2a30">Reemplazar</span></div>`;
const impDone = `<h3>Importar decks</h3><div class="ok">Listo: se sumaron 5 decks.</div><div class="note">3 teclas corren escenas que no están en esta PC. Quedaron grises: creá la escena o cambiá la tecla.</div><div class="acts"><span class="btn p">Ver los decks</span></div><div class="lab">Si el archivo no sirve</div><div class="err" style="margin-top:6px">No es un archivo de decks, o está dañado. No se cambió nada.</div>`;
pair("D", "Importar", "<b>Vertical:</b> antes de tocar nada, el celu dice qué trae el archivo y deja elegir entre <b>Sumar</b> (si se pasa de 32, avisa cuántos entran) y <b>Reemplazar</b> (en rojo; pide confirmar). <b>Apaisado:</b> el resultado. Las teclas de escena buscan su escena en la PC; las que no la encuentran quedan grises y se dice cuántas son. Abajo, el aviso que aparece si el archivo no es válido: nunca se importa a medias.",
  V({ title: "Ajustes", back: true, tab: "", body: dim(settings()), over: sheet(imp) }),
  L({ title: "Ajustes", back: true, body: dim(settings()), over: sheetL(impDone) }));

const mig = `<div class="sheetwrap center"><div class="sheet"><h3>Tus teclas ahora viven en el celu</h3><div class="sub" style="white-space:normal">Pasamos las <b>9 teclas</b> del Inicio y tus <b>6 lanzadores</b> al deck \"Principal\". Revisalo: si está todo, borramos los links y lanzadores de la PC.</div><div class="acts"><span class="btn">Después</span><span class="btn p">Borrar de la PC</span></div></div></div>`;
const migErr = `<div class="err" style="margin-bottom:6px">No se pudieron borrar 2 lanzadores de la PC. <b>Reintentar</b></div>`;
const principal = dbar(["Principal"], "Principal") + dgrid(3, [dk("Traer todo", { g: "◫" }), dk("Trabajo", { g: "▶" }), dk("Juego", { g: "▶" }), dk("Modo sillón", { g: "▶" }), dk("Tele", { g: "📺" }), dk("YouTube", { bg: IMG.red }), dk("YT Music", { bg: IMG.red }), dk("Twitch", { bg: IMG.grape }), dk("Spotify", { bg: IMG.moss }), dkEmpty, dkEmpty, dkEmpty]);
pair("E", "La mudanza (una sola vez)", "La primera vez que se abre la versión con decks, el celu copia las teclas del Inicio y los lanzadores de la PC al deck <b>\"Principal\"</b> (los lanzadores usan el ícono de la app como imagen) y muestra este aviso. <b>Borrar de la PC</b> quita los lanzadores de la PC (los links que son pasos de una escena no se tocan). <b>Después</b> deja todo en los dos lados y el aviso vuelve a aparecer en Ajustes. <b>Apaisado:</b> si la PC no pudo borrar alguno, queda dicho arriba con Reintentar; el deck ya funciona igual.",
  V({ title: "Escenas", right: `<span class="btn">Editar</span>`, tab: "Escenas", body: dim(principal), over: mig }),
  L({ title: "Principal ▾", right: `<span class="btn">Editar</span>`, body: migErr + dgrid(4, [dk("Traer todo", { g: "◫" }), dk("Trabajo", { g: "▶" }), dk("Juego", { g: "▶" }), dk("Modo sillón", { g: "▶" }), dk("Tele", { g: "📺" }), dk("YouTube", { bg: IMG.red }), dk("YT Music", { bg: IMG.red }), dk("Twitch", { bg: IMG.grape }), dk("Spotify", { bg: IMG.moss }), dkEmpty, dkEmpty, dkEmpty], "2.4/1") }));
</script>
</body>
</html>
